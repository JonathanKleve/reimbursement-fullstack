spring.application.name=reimbursement-service

# Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/reimbursement_db
spring.datasource.username=root
spring.datasource.password=Passw0rd!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload & Request Limits
# Increased to 3MB to accommodate 2MB files + Base64 encoding overhead
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Server Port
server.port=8080
